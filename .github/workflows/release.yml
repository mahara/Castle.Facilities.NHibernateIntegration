# https://github.com/actions/checkout
# https://github.com/actions/setup-dotnet
# https://github.com/actions/upload-artifact


name: Release

on:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_ROLL_FORWARD: Major

jobs:

  Build_Test_Package:
    name: Build, Test, and Package

    strategy:
      matrix:
        os: [windows-latest]
        configuration: [Release]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    env:
      TestResults_ArtifactName: TestResults_${{ matrix.os }}_${{ matrix.configuration }}
      Packages_ArtifactName: Packages_${{ matrix.os }}_${{ matrix.configuration }}

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate Build Infrastructure
        run: |
          & "$env:GITHUB_WORKSPACE/buildscripts/ValidateBuildInfrastructure.ps1" `
            -WorkspaceFolderPath "$env:GITHUB_WORKSPACE" `
            -BuildConfigurationFolderName 'buildscripts'
        shell: pwsh

      - name: Prepare NuGet Local Package Sources
        run: |
          & "$env:GITHUB_WORKSPACE/buildscripts/PrepareNuGetLocalPackageSources.ps1" `
            -NuGetConfigFilePath "$env:GITHUB_WORKSPACE/nuget.config" `
            -LocalPackageSourceKeyPrefix 'Local Package Artifacts'
        shell: pwsh

      - name: Build, Test, and Package (PowerShell)
        run: |
          & "$env:GITHUB_WORKSPACE/BuildPackages.ps1" --configuration "${{ matrix.configuration }}"
          exit $LASTEXITCODE
        shell: pwsh

      # - name: Build, Test, and Package (Command Prompt)
      #   run: |
      #     call "%GITHUB_WORKSPACE%/BuildPackages.cmd" --configuration "${{ matrix.configuration }}"
      #     if errorlevel 1 exit /b %errorlevel%
      #   shell: cmd

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ${{ env.TestResults_ArtifactName }}
          path: ${{ github.workspace }}/artifacts/testresults/${{ matrix.configuration }}
          if-no-files-found: warn

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ${{ env.Packages_ArtifactName }}
          path: ${{ github.workspace }}/artifacts/packages/${{ matrix.configuration }}
          if-no-files-found: warn
